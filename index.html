  <script>
    const firebaseConfig={apiKey:"AIzaSyDpeMYS48ZajbyiaL7sl1TfzHkhWBEsBek",authDomain:"nuestra-plata-bd593.firebaseapp.com",projectId:"nuestra-plata-bd593",storageBucket:"nuestra-plata-bd593.firebasestorage.app",messagingSenderId:"724719714651",appId:"1:724719714651:web:6938301f929b7010539a7e"};
    firebase.initializeApp(firebaseConfig);
    const auth=firebase.auth(),db=firebase.firestore();
    const STATE_DOC=db.collection('households').doc('nuestra-plata'),PHOTOS_DOC=db.collection('households').doc('nuestra-plata-photos');

    let viewMonthKey=monthKeyFor(0);
    const freshState={
      incomes:[{id:1,name:'Sueldo Miguel',owner:'Miguel',amount:2300000,status:'RECIBIDO'},{id:2,name:'Aporte familiar Nicole',owner:'Nicole',amount:160000,status:'RECIBIDO'},{id:3,name:'Pensión Nicole',owner:'Nicole',amount:160000,status:'PENDIENTE'},{id:4,name:'Bonos',owner:'Miguel',amount:500000,status:'PENDIENTE'}],

      projects:[{id:1,name:'Vacaciones en familia',type:'Vacaciones',saved:420000,items:['Alojamiento','Bencina','Peajes','Alimentación','Actividades','Emergencias'].map((name,i)=>({name,estimate:[650000,220000,70000,420000,240000,200000][i],spent:i<2?[300000,80000][i]:0}))},{id:2,name:'Renovar segundo piso',type:'Remodelación',saved:350000,items:['Pintura','Piso','Materiales','Mano de obra','Iluminación','Imprevistos'].map((name,i)=>({name,estimate:[180000,390000,160000,280000,90000,150000][i],spent:0}))}],
      credits:[{id:1,name:'Crédito de consumo',owner:'Miguel',principal:1500000,installment:200000,total:10,paid:7},{id:2,name:'Compra tarjeta',owner:'Nicole',principal:480000,installment:60000,total:10,paid:4}],
      photos:{miguel:null,nicole:null}
    };
    let state=structuredClone(freshState),active='inicio',period=3,revealActualIds=new Set(),ufValue=null,ufSource=null;
    function currentUF(){return ufValue??state.ufManualValue??null}
    function applyUF(){const uf=currentUF();if(!uf)return false;let changed=false;Object.values(state.billsByMonth||{}).forEach(list=>list.forEach(b=>{if(b.isUF){const newAmt=Math.round((b.ufAmount||0)*uf);if(newAmt!==b.amount){b.amount=newAmt;changed=true}}}));return changed}
    async function loadUF(){try{const r=await fetch('https://mindicador.cl/api/uf');const d=await r.json();const v=d?.serie?.[0]?.valor;if(v){ufValue=v;ufSource='auto';if(applyUF())save();render()}}catch(e){/* sin conexión a la fuente automática */}}
    async function load(){
      try{
        const [stateSnap,photosSnap]=await Promise.all([STATE_DOC.get(),PHOTOS_DOC.get()]);
        const stateData=stateSnap.exists?stateSnap.data():{};
        const photosData=photosSnap.exists?photosSnap.data():{};
        const merged={...freshState,...stateData,photos:{...freshState.photos,...photosData}};
        if(Array.isArray(stateData.bills)){merged.billsByMonth={...merged.billsByMonth,[monthKeyFor(0)]:stateData.bills};delete merged.bills}
        merged.billsByMonth=merged.billsByMonth||{};
        return merged;
      }catch(e){toast('No se pudieron cargar los datos');return structuredClone(freshState)}
    }
    function currentBills(){state.billsByMonth[viewMonthKey]=state.billsByMonth[viewMonthKey]||[];return state.billsByMonth[viewMonthKey]}
    let saveTimer=null;
    function save(message){
      const write=()=>{const {photos,...dataToSave}=state;STATE_DOC.set(dataToSave).catch(()=>toast('No se pudo guardar, revisa tu conexión'))};
      if(message){clearTimeout(saveTimer);write();toast(message)}
      else{clearTimeout(saveTimer);saveTimer=setTimeout(write,500)}
    }
    function savePhotos(){PHOTOS_DOC.set(state.photos||{}).catch(()=>toast('No se pudo guardar la foto'))}
    function toast(message){document.getElementById('toastRoot').innerHTML=`<div class="toast">${message}</div>`;setTimeout(()=>document.getElementById('toastRoot').innerHTML='',1800)}
    function sum(list,key='amount'){return list.reduce((a,x)=>a+(Number(x[key])||0),0)}
    function target(p){return sum(p.items,'estimate')}function spent(p){return sum(p.items,'spent')}function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}
    function monthLabel(offset=0){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+offset);const s=d.toLocaleDateString('es-CL',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1)}
    function monthShort(offset=0){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+offset);const s=d.toLocaleDateString('es-CL',{month:'short'});return s.charAt(0).toUpperCase()+s.slice(1).replace('.','')}
    function lastMonths(n){return Array.from({length:n},(_,i)=>monthShort(i-(n-1)))}
    let appStarted=false;
    async function init(){
      if(appStarted)return;appStarted=true;
      sideNav.innerHTML=nav.map(([k,i,l])=>`<button class="nav-btn" data-nav="${k}"><i>${i}</i>${l}</button>`).join('');
      bottomNav.innerHTML=nav.slice(0,5).map(([k,i,l])=>`<button data-nav="${k}"><i>${i}</i><small>${l}</small></button>`).join('');
      document.addEventListener('click',clicks);document.addEventListener('input',inputs);document.addEventListener('submit',submits);document.addEventListener('change',changes);
      content.innerHTML='<div class="empty">Cargando datos compartidos…</div>';
      state=await load();
      applyUF();
      renderPhotos();render();
      loadUF();
    }
    document.getElementById('logoutBtn').addEventListener('click',()=>auth.signOut());
    document.getElementById('togglePw').addEventListener('click',()=>{const pw=document.getElementById('loginPassword'),btn=document.getElementById('togglePw');const show=pw.type==='password';pw.type=show?'text':'password';btn.textContent=show?'🙈':'👁'});
    document.getElementById('loginForm').addEventListener('submit',e=>{
      e.preventDefault();
      const email=document.getElementById('loginEmail').value.trim(),pass=document.getElementById('loginPassword').value;
      const errBox=document.getElementById('loginError');errBox.textContent='';
      auth.signInWithEmailAndPassword(email,pass).catch(err=>{errBox.textContent=err.code==='auth/invalid-credential'||err.code==='auth/wrong-password'||err.code==='auth/user-not-found'?'Correo o contraseña incorrectos.':'No se pudo iniciar sesión, intenta de nuevo.'});
    });
    auth.onAuthStateChanged(user=>{
      const loginScreen=document.getElementById('loginScreen'),appRoot=document.getElementById('appRoot');
      if(user){loginScreen.style.display='none';appRoot.style.display='';init()}
      else{loginScreen.style.display='';appRoot.style.display='none';appStarted=false}
    });
    function renderPhotos(){for(const person of ['miguel','nicole']){const box=document.getElementById('photo'+person[0].toUpperCase()+person.slice(1));box.innerHTML=state.photos?.[person]?`<img src="${state.photos[person]}" alt="Foto de ${person}">`:`<b>${person[0].toUpperCase()}</b>`}}
    function render(){
      document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===active));
      const label=nav.find(x=>x[0]===active)?.[2]||'Inicio';pageTitle.textContent=active==='inicio'?monthLabel():label;pageSub.textContent=active==='inicio'?'Hogar compartido':`Hogar compartido · ${monthLabel()}`;
      newButton.textContent=active==='proyectos'?'＋ Nuevo proyecto':active==='cuentas'?'＋ Nueva cuenta':active==='creditos'?'＋ Nuevo crédito':'＋ Nuevo ingreso';
      newButton.dataset.open=active==='proyectos'?'project':active==='cuentas'?'bill':active==='creditos'?'credit':'income';
      content.innerHTML=active==='inicio'?dashboard():active==='ingresos'?incomePage():active==='cuentas'?billsPage():active==='ahorros'?savingsPage():active==='creditos'?creditsPage():projectsPage();
    }
    function kpi(icon,label,value,note,kind=''){return `<article class="kpi card"><i class="${kind==='warn'?'coral-bg':kind==='good'?'lime-bg':''}">${icon}</i><span>${label}</span><b class="${kind==='warn'?'coral':''}">${value}</b><small class="${kind}">${note}</small></article>`}
    function dashboard(){
      const currentMonthBills=state.billsByMonth[monthKeyFor(0)]||[];
      const received=sum(state.incomes.filter(x=>x.status==='RECIBIDO')),expected=sum(state.incomes),pending=sum(currentMonthBills.filter(x=>x.status!=='PAGADO')),savings=sum(state.projects,'saved'),p=state.projects[0],t=p?target(p):0,progress=p?pct(p.saved,t):0;
      const creditsLeft=sum(state.credits.map(c=>({v:c.total-c.paid})),'v'),creditsBalance=sum(state.credits.map(c=>({v:(c.total-c.paid)*c.installment})),'v'),creditsInterest=sum(state.credits.map(c=>({v:Math.max(0,c.installment*c.total-c.principal)})),'v');
      const ownerBlock=owner=>{const list=currentMonthBills.filter(b=>b.owner===owner&&b.status!=='PAGADO');return `<div class="owner"><h3><i>${owner[0]}</i>Responsable <b>&nbsp;${owner}</b></h3>${list.slice(0,3).map(b=>`<div class="list-row"><span>${b.name}<small>Vence ${b.due}</small></span><strong>${money(b.amount)}</strong><em class="badge">Por pagar</em></div>`).join('')||'<div class="empty">Sin cuentas pendientes</div>'}<div class="owner-total">Total ${owner}<b>${money(sum(list))}</b></div></div>`};
      return `<section class="kpis">${kpi('$','Ingresos recibidos',money(received),'Al día')}${kpi('◷','Ingresos esperados',money(expected),'Este mes')}${kpi('!','Cuentas pendientes',money(pending),'Atención requerida','warn')}${kpi('◉','Ahorro total',money(savings),'Metas activas','good')}</section><section class="dashboard"><article class="card pad"><div class="card-head"><div><h2>Cuentas pendientes</h2><p>Gastos asignados por responsable</p></div><button class="secondary" data-nav="cuentas">Ver todas</button></div>${ownerBlock('Miguel')}${ownerBlock('Nicole')}</article><div class="right-stack"><article class="card pad"><div class="card-head"><div><h2>Proyecto principal</h2><p>${p?.name||'Sin proyecto'}</p></div><button class="secondary" data-nav="proyectos">Ver detalle</button></div>${p?`<div class="goal-body"><div class="ring" style="--p:${progress}%"><b>${progress}%</b><small>Completado</small></div><div class="goal-numbers"><span>Ahorrado<b>${money(p.saved)}</b></span><span>Presupuesto<strong>${money(t)}</strong></span><div class="progress"><i style="width:${progress}%"></i></div><small>Falta financiar <b>${money(Math.max(0,t-p.saved))}</b></small></div></div>`:'<div class="empty">Crea un proyecto para comenzar.</div>'}</article><article class="card pad"><div class="card-head"><div><h2>Resumen de créditos</h2><p>Compromisos activos del hogar</p></div><button class="secondary" data-nav="creditos">Ver detalle</button></div>${state.credits.length?`<div class="credit-stats"><span><b>${creditsLeft}</b>cuotas restantes</span><span><b>${money(creditsBalance)}</b>saldo programado</span><span><b class="coral">${money(creditsInterest)}</b>interés total</span></div>`:'<div class="empty">Sin créditos registrados.</div>'}</article></div></section>`;
    }
    function incomePage(){return `<section class="page-card card"><div class="section-title"><div><h2>Ingresos del mes</h2><p>Registra sueldos, pensiones, bonos y cualquier ingreso adicional.</p></div><div class="big-total"><small>Total esperado</small><b>${money(sum(state.incomes))}</b></div></div><div class="table"><div class="table-head"><span>Ingreso</span><span>Persona</span><span>Monto</span><span>Estado</span></div>${state.incomes.map(x=>`<div class="table-row"><span><b>${x.name}</b><small>${monthLabel()}</small></span><span><i class="avatar">${x.owner[0]}</i>${x.owner}</span><strong>${money(x.amount)}</strong><button class="status ${x.status==='RECIBIDO'?'paid':''}" data-income="${x.id}">${x.status==='RECIBIDO'?'Recibido':'Pendiente'}</button></div>`).join('')}</div></section>`}
    function payCell(x){
      const answered=x.actual!==null,revealed=revealActualIds.has(x.id),matches=answered&&x.actual===x.amount;
      let matchCol,payReal,diffText,diffClass,statusHtml;
      if(!answered&&!revealed){
        matchCol=`<div class="pay-toggle" data-label="¿Según presupuesto?"><button class="pay-btn yes" data-pay-yes="${x.id}">Sí</button><button class="pay-btn no" data-pay-no="${x.id}">No</button></div>`;
        payReal=`<span class="muted-cell" data-label="Pago real">—</span>`;
        diffText='—';diffClass='neutral';
        statusHtml=`<span class="status-hint" data-label="Estado">Pendiente</span>`;
      }else if(matches){
        matchCol=`<div class="pay-match" data-label="¿Según presupuesto?"><span class="check-badge">✓ Sí</span><button class="link-btn" data-pay-reset="${x.id}">cambiar</button></div>`;
        payReal=`<span class="muted-cell" data-label="Pago real">${money(x.amount)}</span>`;
        diffText='Sin diferencia';diffClass='neutral';
        statusHtml=`<button class="status ${x.status==='PAGADO'?'paid':''}" data-label="Estado" data-bill="${x.id}">${x.status==='PAGADO'?'Pagado':'Confirmar pago'}</button>`;
      }else{
        matchCol=`<div class="pay-match" data-label="¿Según presupuesto?"><span class="check-badge no-badge">No</span><button class="link-btn" data-pay-reset="${x.id}">cambiar</button></div>`;
        payReal=`<label class="actual-input" data-label="Pago real"><small>$</small><input type="number" min="0" data-actual="${x.id}" value="${x.actual??''}" placeholder="Monto pagado"></label>`;
        const d=answered?x.amount-x.actual:null;
        diffText=d===null?'—':d>=0?'Ahorraste '+money(d):'Exceso '+money(Math.abs(d));
        diffClass=d===null?'neutral':d>=0?'saving':'over';
        statusHtml=`<button class="status ${x.status==='PAGADO'?'paid':''}" data-label="Estado" data-bill="${x.id}">${x.status==='PAGADO'?'Pagado':'Confirmar pago'}</button>`;
      }
      return `${matchCol}${payReal}<span class="difference ${diffClass}" data-label="Ahorro / exceso">${diffText}</span>${statusHtml}`;
    }
    function monthlyChart(name,values){
      const labels=lastMonths(values.length),max=Math.max(...values,1),last=values[values.length-1],prev=values[values.length-2];
      const change=prev?Math.round((last-prev)/prev*100):0;
      const bars=values.map((v,i)=>`<div class="bar-col"><span class="bar-value">${Math.round(v/1000)}k</span><div class="bar-track"><div class="bar-fill${i===values.length-1?(change>0?' up':change<0?' down':''):''}" style="height:${Math.max(4,Math.round(v/max*100))}%"></div></div><small>${labels[i]}</small></div>`).join('');
      return `<article class="card monthly-card"><div class="monthly-head"><h3>${name}</h3><span class="change-badge ${change>0?'up':change<0?'down':'flat'}">${change>0?'▲ Subió '+change+'%':change<0?'▼ Bajó '+Math.abs(change)+'%':'Sin cambio'}</span></div><div class="bar-chart">${bars}</div><div class="monthly-foot">Último mes registrado <b>${money(last)}</b></div></article>`;
    }
    function prevMonthKey(key){const [y,m]=key.split('-').map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
    function billsPage(){
      const bills=currentBills();
      const history={Supermercado:[400000,450000,409000,438000,421000,445000],Luz:[45000,74000,104000,88000,91000,96000],Internet:[15000,15000,15000,15000,15000,15000],Dividendo:[550000,557000,551000,555000,555000,555000]};
      const suggestions=bills.filter(b=>history[b.name]).map(b=>{const values=history[b.name].slice(-period),avg=Math.round(sum(values.map(amount=>({amount})))/values.length/1000)*1000;return {...b,avg,diff:avg-b.amount}});
      const prevKey=prevMonthKey(viewMonthKey),prevBills=state.billsByMonth[prevKey];
      const monthSwitcher=`<div class="month-switcher"><button data-month-nav="prev" title="Mes anterior">‹</button><strong>${monthKeyLabel(viewMonthKey)}</strong><button data-month-nav="next" title="Mes siguiente">›</button>${viewMonthKey!==monthKeyFor(0)?`<button class="secondary today-btn" data-month-nav="today">Hoy</button>`:''}</div>`;
      const billsBlock=bills.length?`<div class="table bills-table"><div class="table-head"><span>Cuenta</span><span>Responsable</span><span>Presupuesto</span><span>¿Según presupuesto?</span><span>Pago real</span><span>Ahorro / exceso</span><span>Estado</span></div>${bills.map((x,i)=>{return `<div class="table-row"><span class="edit-cell acct-cell"><span class="reorder"><button data-move-bill="up" data-bill-id="${x.id}" title="Subir" ${i===0?'disabled':''}>▲</button><button data-move-bill="down" data-bill-id="${x.id}" title="Bajar" ${i===bills.length-1?'disabled':''}>▼</button></span><span class="acct-fields"><input class="cell-input" data-bill-field="name" data-bill-id="${x.id}" value="${escapeAttr(x.name)}" aria-label="Nombre de la cuenta"><label class="due-input"><small>Vence</small><input class="cell-input due" data-bill-field="due" data-bill-id="${x.id}" value="${escapeAttr(x.due)}" aria-label="Vencimiento"></label></span></span><span class="edit-cell" data-label="Responsable"><i class="avatar">${x.owner[0]}</i><select class="cell-select" data-bill-field="owner" data-bill-id="${x.id}"><option ${x.owner==='Miguel'?'selected':''}>Miguel</option><option ${x.owner==='Nicole'?'selected':''}>Nicole</option></select></span>${x.isUF?`<div class="uf-amount" data-label="Presupuesto"><label class="money-input budget-amount"><small>UF</small><input type="number" min="0" step="0.01" class="cell-input" data-bill-field="ufAmount" data-bill-id="${x.id}" value="${x.ufAmount}"></label><small class="uf-note">${currentUF()?money(x.amount)+' hoy':'Esperando valor UF'}</small></div>`:`<label class="money-input budget-amount" data-label="Presupuesto"><small>$</small><input type="number" min="0" class="cell-input" data-bill-field="amount" data-bill-id="${x.id}" value="${x.amount}"></label>`}${payCell(x)}</div>`}).join('')}</div>`:`<div class="empty-state-bills"><p>Todavía no hay cuentas cargadas para ${monthKeyLabel(viewMonthKey)}.</p>${prevBills&&prevBills.length?`<button class="primary" data-clone-month="${prevKey}">Copiar cuentas de ${monthKeyLabel(prevKey)}</button>`:'<p class="note">Agrégalas con el formulario de arriba.</p>'}</div>`;
      return `<section class="bills-page">${monthSwitcher}${bills.some(b=>b.isUF)&&!currentUF()?`<article class="card uf-banner"><span>No pudimos traer el valor de la UF automáticamente. Ingresa el valor de hoy para calcular las cuentas en UF:</span><div class="uf-banner-form"><label class="money-input"><small>$</small><input type="number" min="0" id="ufManualInput" placeholder="Valor UF hoy"></label><button class="secondary" id="ufManualBtn">Usar este valor</button></div></article>`:''}<article class="page-card card"><div class="section-title"><div><h2>Cuentas por pagar</h2><p>Compara lo presupuestado con el pago real.${bills.some(b=>b.isUF)&&currentUF()?` <span class="uf-pill">UF hoy: ${money(currentUF())}${ufSource==='manual'?' (ingresado por ustedes)':''}</span>`:''}</p></div></div>${billsBlock}</article><article class="card recommendations"><div class="section-title"><div><span class="type">Análisis del comportamiento</span><h2>Presupuesto recomendado</h2><p>Promedio real de tus pagos anteriores. Tú decides si aplicarlo.</p></div><div class="period-tabs">${[3,6,12].map(n=>`<button class="${period===n?'active':''}" data-period="${n}">${n} meses</button>`).join('')}</div></div><div class="suggestions">${suggestions.map(s=>`<div class="suggestion"><span>${s.name}<small>Actual: ${money(s.amount)}</small></span><b>${money(s.avg)}</b><em>${s.diff===0?'Sin cambios':s.diff>0?'Subir '+money(s.diff):'Bajar '+money(Math.abs(s.diff))}</em><button data-suggestion="${s.id}" data-value="${s.avg}">Aplicar sugerencia</button></div>`).join('')}</div><p class="note">La recomendación considera el promedio del período elegido y ayuda a anticipar variaciones de gasto.</p></article><article class="card monthly-panel"><div class="section-title"><div><span class="type">Historial real</span><h2>Gastos mensuales</h2><p>Compara mes a mes para detectar alzas antes de que te sorprendan.</p></div></div><div class="monthly-grid">${Object.entries(history).map(([name,values])=>monthlyChart(name,values)).join('')}</div></article></section>`;
    }
    function savingsPage(){return `<section><div class="section-title standalone"><div><h2>Metas de ahorro</h2><p>Cada aporte acerca un poco más sus proyectos familiares.</p></div></div><div class="grid-two">${state.projects.map(p=>{const t=target(p),pc=pct(p.saved,t);return `<article class="card project-card"><span class="type">${p.type}</span><h2>${p.name}</h2><b class="project-money">${money(p.saved)}</b><p>de ${money(t)}</p><div class="progress"><i style="width:${pc}%"></i></div><footer><b>${pc}% ahorrado</b><span>Faltan ${money(Math.max(0,t-p.saved))}</span></footer></article>`}).join('')}</div></section>`}
    function creditsPage(){return `<section><div class="section-title standalone"><div><h2>Créditos activos</h2><p>Cuotas restantes y costo final de cada deuda.</p></div></div><div class="grid-two">${state.credits.map(c=>{const total=c.installment*c.total;return `<article class="card project-card"><div class="card-head"><span class="type">Responsable ${c.owner}</span><button class="icon-btn" data-remove-credit="${c.id}" title="Eliminar crédito">×</button></div><h2>${c.name}</h2><div class="credit-detail"><span>Cuotas pagadas<b>${c.paid} de ${c.total}</b></span><span>Cuotas restantes<b>${c.total-c.paid}</b></span><span>Saldo programado<b>${money((c.total-c.paid)*c.installment)}</b></span><span>Interés total<b class="coral">${money(Math.max(0,total-c.principal))}</b></span></div><div class="progress"><i style="width:${c.total?c.paid/c.total*100:0}%;background:linear-gradient(90deg,var(--primary),var(--purple))"></i></div></article>`}).join('')||'<div class="empty">Sin créditos registrados. Agrega el primero arriba.</div>'}</div></section>`}
    function projectsPage(){return `<section><div class="section-title standalone"><div><h2>Proyectos familiares</h2><p>Presupuesten antes de gastar y ajusten cada partida a su realidad.</p></div><button class="secondary" data-open="project">＋ Usar una plantilla</button></div><div class="projects">${state.projects.map(p=>{const t=target(p),s=spent(p);return `<article class="card project-budget"><div class="project-head"><div><span class="type">${p.type}</span><h2>${p.name}</h2><p>${p.items.length} partidas planificadas</p></div><div class="project-summary"><span>Presupuesto<b>${money(t)}</b></span><span>Gastado<b>${money(s)}</b></span><span>Ahorrado<b class="lime-text">${money(p.saved)}</b></span></div></div><div class="budget-head"><span>Partida</span><span>Monto aproximado</span><span>Gasto real</span><span></span></div>${p.items.map((it,i)=>`<div class="budget-row"><input data-item="${p.id}" data-index="${i}" data-field="name" value="${escapeAttr(it.name)}" aria-label="Nombre de partida"><label class="money-input"><small>$</small><input type="number" min="0" data-item="${p.id}" data-index="${i}" data-field="estimate" value="${it.estimate}"></label><label class="money-input"><small>$</small><input type="number" min="0" data-item="${p.id}" data-index="${i}" data-field="spent" value="${it.spent}"></label><button class="icon-btn" data-remove-item="${p.id}" data-index="${i}" title="Eliminar partida">×</button></div>`).join('')}<button class="add-row" data-add-item="${p.id}">＋ Agregar otra partida</button><footer class="budget-footer"><span>Disponible según ahorro <b>${money(p.saved-s)}</b></span><span>Falta financiar <b>${money(Math.max(0,t-p.saved))}</b></span></footer></article>`}).join('')}</div></section>`}
    function escapeAttr(v){return String(v).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}
    function showModal(type){const forms={income:`<h2>Nuevo ingreso</h2><p>Agrega un ingreso único o mensual.</p><label>Nombre<input name="name" placeholder="Ej. Bono trimestral" required></label><div class="form-grid"><label>Persona<select name="owner"><option>Miguel</option><option>Nicole</option></select></label><label>Monto<input name="amount" type="number" min="0" required></label></div><label>Estado<select name="status"><option value="PENDIENTE">Pendiente</option><option value="RECIBIDO">Recibido</option></select></label>`,bill:`<h2>Nueva cuenta</h2><p>Define monto, responsable y vencimiento.</p><label>Cuenta<input name="name" placeholder="Ej. Agua" required></label><div class="form-grid"><label>Responsable<select name="owner"><option>Miguel</option><option>Nicole</option></select></label><label>Monto en pesos<input name="amount" type="number" min="0" placeholder="Ej. 45000"></label></div><label>¿O está en UF? (deja el monto en pesos vacío)<input name="ufAmount" type="number" min="0" step="0.01" placeholder="Ej. 14.13 UF"></label><label>Vencimiento<input name="due" placeholder="Ej. 25 ago" required></label>`,project:`<h2>Crear proyecto</h2><p>Parte con una plantilla y ajústala a tu realidad.</p><label>Nombre<input name="name" placeholder="Ej. Vacaciones 2027" required></label><label>Plantilla<select name="template"><option>Vacaciones</option><option>Remodelación</option><option>Desde cero</option></select></label><label>Ahorro inicial<input name="saved" type="number" min="0" value="0"></label>`,credit:`<h2>Nuevo crédito</h2><p>Registra un crédito o deuda para seguir sus cuotas.</p><label>Nombre<input name="name" placeholder="Ej. Crédito automotriz" required></label><div class="form-grid"><label>Responsable<select name="owner"><option>Miguel</option><option>Nicole</option></select></label><label>Monto del crédito<input name="principal" type="number" min="0" required></label></div><div class="form-grid"><label>Valor de la cuota<input name="installment" type="number" min="0" required></label><label>N° total de cuotas<input name="total" type="number" min="1" required></label></div><label>Cuotas ya pagadas<input name="paid" type="number" min="0" value="0" required></label>`};modalRoot.innerHTML=`<div class="modal-bg" data-close><div class="modal"><button class="close" data-close>×</button><form data-form="${type}">${forms[type]}<button class="primary full">Guardar</button></form></div></div>`}
    function clicks(e){const monthNav=e.target.closest('[data-month-nav]');if(monthNav){const dir=monthNav.dataset.monthNav;if(dir==='today')viewMonthKey=monthKeyFor(0);else{const [y,m]=viewMonthKey.split('-').map(Number);const d=new Date(y,m-1+(dir==='next'?1:-1),1);viewMonthKey=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}revealActualIds=new Set();render();return}const cloneMonth=e.target.closest('[data-clone-month]');if(cloneMonth){const source=state.billsByMonth[cloneMonth.dataset.cloneMonth]||[];state.billsByMonth[viewMonthKey]=source.map(b=>({...b,id:Date.now()+Math.random(),actual:null,status:'PENDIENTE'}));save('Cuentas copiadas, listas para completar');render();return}const ufBtn=e.target.closest('#ufManualBtn');if(ufBtn){const input=document.getElementById('ufManualInput'),v=Number(input.value);if(!v||v<=0){toast('Ingresa un valor válido de UF');return}state.ufManualValue=v;state.ufManualDate=new Date().toISOString();ufSource='manual';applyUF();save('Valor UF guardado');render();return}const payYes=e.target.closest('[data-pay-yes]');if(payYes){const x=currentBills().find(b=>b.id==payYes.dataset.payYes);x.actual=x.amount;x.status='PAGADO';revealActualIds.delete(x.id);save('Cuenta marcada como pagada');render();return}const payNo=e.target.closest('[data-pay-no]');if(payNo){revealActualIds.add(payNo.dataset.payNo);render();return}const payReset=e.target.closest('[data-pay-reset]');if(payReset){const x=currentBills().find(b=>b.id==payReset.dataset.payReset);x.actual=null;x.status='PENDIENTE';revealActualIds.delete(x.id);save();render();return}const move=e.target.closest('[data-move-bill]');if(move){const list=currentBills(),idx=list.findIndex(b=>b.id==move.dataset.billId),dir=move.dataset.moveBill;if(dir==='up'&&idx>0){[list[idx-1],list[idx]]=[list[idx],list[idx-1]]}else if(dir==='down'&&idx<list.length-1){[list[idx+1],list[idx]]=[list[idx],list[idx+1]]}save();render();return}const navEl=e.target.closest('[data-nav]');if(navEl){active=navEl.dataset.nav;render();return}const open=e.target.closest('[data-open]');if(open){showModal(open.dataset.open);return}if(e.target.matches('.modal-bg,[data-close]')){modalRoot.innerHTML='';return}const income=e.target.closest('[data-income]');if(income){const x=state.incomes.find(x=>x.id==income.dataset.income);x.status=x.status==='RECIBIDO'?'PENDIENTE':'RECIBIDO';save('Ingreso actualizado');render();return}const bill=e.target.closest('[data-bill]');if(bill){const x=currentBills().find(x=>x.id==bill.dataset.bill);if(x.actual===null){toast('Primero ingresa el pago real');return}x.status=x.status==='PAGADO'?'PENDIENTE':'PAGADO';save('Cuenta actualizada');render();return}const tab=e.target.closest('[data-period]');if(tab){period=Number(tab.dataset.period);render();return}const sug=e.target.closest('[data-suggestion]');if(sug){currentBills().find(x=>x.id==sug.dataset.suggestion).amount=Number(sug.dataset.value);save('Presupuesto actualizado');render();return}const add=e.target.closest('[data-add-item]');if(add){state.projects.find(x=>x.id==add.dataset.addItem).items.push({name:'Nueva partida',estimate:0,spent:0});save();render();return}const remove=e.target.closest('[data-remove-item]');if(remove){state.projects.find(x=>x.id==remove.dataset.removeItem).items.splice(Number(remove.dataset.index),1);save('Partida eliminada');render();return}const removeCredit=e.target.closest('[data-remove-credit]');if(removeCredit){state.credits=state.credits.filter(c=>c.id!=removeCredit.dataset.removeCredit);save('Crédito eliminado');render()}}
    function inputs(e){if(e.target.dataset.billField&&e.target.tagName==='INPUT'){const x=currentBills().find(b=>b.id==e.target.dataset.billId),field=e.target.dataset.billField;if(field==='ufAmount'){x.ufAmount=Number(e.target.value);const uf=currentUF();if(uf)x.amount=Math.round(x.ufAmount*uf);save();return}x[field]=field==='amount'?Number(e.target.value):e.target.value;save();return}if(e.target.dataset.actual){const x=currentBills().find(x=>x.id==e.target.dataset.actual);x.actual=e.target.value===''?null:Number(e.target.value);save();return}if(e.target.dataset.item){const p=state.projects.find(x=>x.id==e.target.dataset.item),it=p.items[Number(e.target.dataset.index)],field=e.target.dataset.field;it[field]=field==='name'?e.target.value:Number(e.target.value);save()}}
    function submits(e){const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const d=Object.fromEntries(new FormData(form)),id=Date.now();if(form.dataset.form==='income')state.incomes.push({id,name:d.name,owner:d.owner,amount:Number(d.amount),status:d.status});if(form.dataset.form==='bill'){const isUF=Number(d.ufAmount)>0;currentBills().push({id,name:d.name,owner:d.owner,amount:isUF?Math.round(Number(d.ufAmount)*(currentUF()||0)):Number(d.amount||0),actual:null,due:d.due,status:'PENDIENTE',isUF,ufAmount:isUF?Number(d.ufAmount):undefined})}if(form.dataset.form==='project'){state.projects.push({id,name:d.name,type:d.template,saved:Number(d.saved),items:templates[d.template].map(name=>({name,estimate:0,spent:0}))});active='proyectos'}if(form.dataset.form==='credit')state.credits.push({id,name:d.name,owner:d.owner,principal:Number(d.principal),installment:Number(d.installment),total:Number(d.total),paid:Number(d.paid)});save('Datos guardados');modalRoot.innerHTML='';render()}
    function changes(e){if(e.target.dataset.billField){const x=currentBills().find(b=>b.id==e.target.dataset.billId);x[e.target.dataset.billField]=e.target.value;render();save();return}if(!e.target.dataset.photo)return;const file=e.target.files?.[0];if(!file)return;if(file.size>250000){toast('La imagen debe pesar menos de 250 KB');return}const reader=new FileReader();reader.onload=()=>{state.photos=state.photos||{};state.photos[e.target.dataset.photo]=reader.result;savePhotos();toast('Foto actualizada');renderPhotos()};reader.readAsDataURL(file)}
  </script>
